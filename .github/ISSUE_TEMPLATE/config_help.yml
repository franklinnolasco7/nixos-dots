name: Config help
description: Getting started or configuring something
title: "[Help] "
labels: [question]
assignees: []
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste `nixos-rebuild` / `home-manager` output here
      render: text
  - type: input
    id: files
    attributes:
      label: Related files
      description: Module or dotfile paths you touched; links preferred