name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # PR titles must be Scoped Commits (<scope>: <description>); a bad title
      # would otherwise reach main unchecked via squash merge.
      - name: Validate PR title is Scoped Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^[a-z][a-z0-9,-]*: .+$'; then
            echo "PR title must be a Scoped Commit: <scope>: <description>"
            echo "  e.g. 'hyprland: split monitors across outputs'"
            echo "Multi-scope: comma-separate scopes, e.g. 'hyprland,ci: ...'"
            echo "Got: $TITLE"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      # A stale flake.lock silently breaks reproducibility (core philosophy),
      # so flag it before it reaches main.
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Flake check
        run: nix flake check
      - name: Format check
        run: nix develop -c ./install/format.sh check
      # install/*.sh touch disk/partitions; shfmt only formats, shellcheck
      # lints. -S warning: ignore style/info noise, fail on real problems.
      - name: ShellCheck
        run: nix develop -c shellcheck -S warning install/*.sh