name: Flake lockfile update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # weekly Sunday

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          inputs: nixpkgs disko nixos-anywhere home-manager sops-nix mcp-servers-nix quickshell-mcp spicetify-nix obsidian-extensions
          pr-title: "flake: update lockfile inputs"
          pr-labels: dependencies
